name: CI

on:
  push:
    branches: [ main, cursor/** ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        cd backend
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        cd backend
        pytest -v --tb=short
    
    - name: Check for secrets in code
      run: |
        if grep -r "X_API_KEY\|OPENAI_API_KEY\|Bearer\|sk-" --include="*.py" --include="*.ts" --include="*.tsx" backend/ frontend/ 2>/dev/null | grep -v "\.env\.example" | grep -v "your_.*_here" | grep -v "# "; then
          echo "Error: Found potential secrets in code"
          exit 1
        else
          echo "No secrets found in code"
        fi
  
  test-integration:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Python dependencies
      run: |
        cd backend
        pip install -r requirements.txt
    
    - name: Install Temporal CLI
      run: |
        VERSION="1.1.1"
        curl -L "https://temporal.download/cli/archive/v${VERSION}/temporal_cli_${VERSION}_linux_amd64.tar.gz" -o temporal.tar.gz
        tar -xzf temporal.tar.gz -C /tmp
        sudo mv /tmp/temporal /usr/local/bin/
        temporal --version
    
    - name: Start Temporal dev server
      run: |
        temporal server start-dev &
        # Wait for server to be ready (poll port 7233)
        for i in {1..30}; do
          if timeout 1 bash -c "echo > /dev/tcp/localhost/7233" 2>/dev/null; then
            echo "Temporal server is ready"
            break
          fi
          if [ $i -eq 30 ]; then
            echo "Temporal server failed to start within 30s"
            exit 1
          fi
          sleep 1
        done
    
    - name: Run integration tests
      run: |
        cd backend
        pytest -v -m integration --tb=short
  
  build-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install dependencies
      run: |
        cd frontend
        npm install
    
    - name: Build
      run: |
        cd frontend
        npm run build
